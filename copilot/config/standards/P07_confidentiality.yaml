# PayNest Contracting Standards v1.0 — Client Agreements (Sell-Side)
# Rule P7. Owner: Legal Counsel.

id: P7
title: Confidentiality
category: Information Protection
weight: 4
critical: false
if_silent: risk        # without a clause, PayNest's pricing and security documentation are unprotected
na_when: Never.

rationale: >
  PayNest's pricing, platform design and security documentation are commercially sensitive.
  PayNest also undertakes to every client that its data is never shared with third parties; a
  clause compelling disclosure to one client's vendors would place PayNest in breach of its other
  client agreements.

preferred: >
  Mutual confidentiality obligations covering each Party's Confidential Information, including
  PayNest's pricing, platform architecture and security documentation, with customary exclusions
  (public domain, independently developed, lawfully received, compelled by law) and survival of not
  less than three (3) years after termination or expiry.

fallback: >
  One-way confidentiality protecting only the Client's information, provided that PayNest's
  security documentation is protected by a separate non-disclosure agreement referenced in the
  Agreement.

walk_away: >
  Any obligation on PayNest to disclose Client Data, employee data, security assessments or audit
  reports to the Client's other service providers or third parties; or any right for the Client to
  publish or onward-share PayNest's security reports.

standard_clause: >
  "Each Party shall keep the other Party's Confidential Information confidential, use it solely for
  the purposes of this Agreement and not disclose it to any third party except as permitted by this
  Clause. This Clause shall survive for three (3) years after termination or expiry."

proposed_amendment: >
  Make confidentiality mutual, extend protection to PayNest's security documentation, and delete
  any obligation to share data or security reports with the Client's third-party providers.

approval:
  fallback: Legal Counsel
  walk_away: General Counsel

look_for: [confidential information, confidentiality, non-disclosure, disclose, share with,
           third parties, service providers, survive]

red_flags: [service providers on request, publish]   # walk-away phrases: tripwire escalates if the model misses them
