# Gateway profile: the models served THROUGH Bifrost (infra/bifrost) and traced in Langfuse.
# docker-compose.yml turns it on with SETTINGS_PROFILE=gateway. Bifrost names models as provider/model.

models:
  analyst:
    model: ollama/qwen2.5:7b-instruct
  judge:
    model: ollama/llama3.1:8b
  embed:
    model: ollama/nomic-embed-text
